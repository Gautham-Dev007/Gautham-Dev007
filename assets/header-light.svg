<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Gautham Seetharaman, embedded systems engineer">
  <style>
    .curve { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s ease-in-out infinite; }
    .readout { opacity: 0; animation: show 9s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw {
      0% { stroke-dashoffset: 1; opacity: 1; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      90% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes show { 0%, 42% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .curve, .readout, .cursor { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
